<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>GitHub Auto Translator</title><style>body{width:300px;margin:0;padding:12px;background:#0d1117;color:#c9d1d9;font:14px system-ui}.row{display:grid;gap:6px;margin-bottom:12px}label{font-size:12px;color:#8b949e}select,button{min-height:32px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#f0f6fc;padding:6px}button{cursor:pointer;font-weight:600}#togglePage{background:#238636}#toggleView{background:#1f6feb}.hint{font-size:11px;color:#8b949e;line-height:1.5}</style></head><body><div class="row"><label for="targetLang">目标语言</label><select id="targetLang"><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><div class="row"><label for="sourceLang">来源语言</label><select id="sourceLang"><option value="auto">自动检测</option><option value="en">English</option><option value="zh-CN">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></div><div class="row"><button id="togglePage">关闭翻译</button><button id="toggleView">切换原文/译文</button></div><div class="hint">自动跳过代码块、脚本和样式内容。</div><script src="popup.js"></script></body></html>
